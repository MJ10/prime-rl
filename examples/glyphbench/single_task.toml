# GlyphBench Qwen3.5-4B single-task recipe, ported from prime-rl v0.9.0 to v0.10 (main).
# Default task: Snake Easy. One 512-rollout GRPO group per optimizer step.

max_steps = 50
# PrimeRL trainer capacity. Token limits do not belong to the GlyphBench env.
seq_len = 65536

[run]
name = "single-snake-easy-v1"

[env_vars]
HF_HUB_OFFLINE = "1"
TRITON_CACHE_DIR = "/tmp/glyphbench-triton-cache"
TORCHINDUCTOR_CACHE_DIR = "/tmp/glyphbench-torchinductor-cache"

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1
num_infer_replicas = 1
gpus_per_node = 8
orchestrator_on_inference = true

[slurm]
job_name = "gb-single-v1"
project_dir = "."
partition = "gpu"
time = "7-00:00:00"
cleanup_grace_period = 120

[model]
name = "Qwen/Qwen3.5-4B"

[weight_broadcast]
type = "nccl"
port = 29501
timeout = 1800

[rollout_transport]
type = "zmq"
port = 29510

[ckpt]
interval = 10
keep_last = 3
keep_interval = 50

[monitors]
# Full token-level trace files are high volume; v0.9 recipe disabled them on both sides.
file = "None"
# v0.10 enables the Prime platform monitor by default (needs a Prime API key); v0.9 had it off.
prime = "None"

[monitors.wandb]
project = "glyphbench-rl"
group = "qwen35-4b-single-task-v1"
tags = ["glyphbench", "single-task", "prime-rl-v0.10", "verifiers-v1", "ipo"]
offline = false

[trainer]
dist_timeout_seconds = 3600

[trainer.model]
attn = "auto"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
# v0.9: optim_cpu_offload = false, fsdp_cpu_offload = false
offload = "none"
fused_lm_head_token_chunk_size = 8192
ac_offloading = "None"
compile = "None"

[trainer.model.ac]
# v0.9 selective AC recomputed norm/attn_proj/mlp/linear_attn and kept the softmax
# attention kernel. v0.10 checkpoints whole blocks and `targets` names operators to SAVE,
# so keep only the softmax-attention kernels saved and recompute everything else.
mode = "selective"
freq = 1
targets = ["prime_rl_attn", "flash_attn", "flash_attn_3", "prime_rl_ring"]

[trainer.optim]
type = "adamw"
lr = 1e-6
betas1 = 0.9
betas2 = 0.95
weight_decay = 0.0
max_norm = 1.0

[trainer.scheduler]
type = "constant"

[trainer.loss]
# v0.9: ipo_threshold = 0.1, kl_tau = 1e-3 (KL term removed in v0.10).
type = "ipo"
eps = 0.1
adv_tau = 1.0

[orchestrator]
batch_size = 512
max_staleness = 3
# v0.9 filter_zero_advantages = true dropped zero-advantage tokens without backfilling.
constant_trainer_batch_size = false
# Keep vLLM telemetry available to adaptive scheduling without exporting every
# per-replica Prometheus counter and histogram to W&B.
collect_inference_metrics = false

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true
thinking_retention = "all"

[orchestrator.train]
group_size = 512

[orchestrator.train.algo]
type = "grpo"

[orchestrator.train.sampling]
max_completion_tokens = 4096
temperature = 1.0

[[orchestrator.train.source]]
name = "train-snake-easy"
env.taskset.id = "glyphbench"
env.taskset.tasks = ["glyphbench/classics-snake-easy-v0"]
env.taskset.seed = 42
env.taskset.num_seeds = 512
env.taskset.mixed_seeds = true
env.taskset.max_output_tokens = 4096
env.taskset.forfeit_mode = "noop"
env.taskset.use_memory = false
env.player.harness.id = "glyphbench"
env.player.runtime.type = "subprocess"
serve.pool.type = "elastic"
serve.pool.max_workers = 8
serve.pool.multiplex = 128

[orchestrator.eval]
interval = 10
group_size = 1
skip_first_step = false

[orchestrator.eval.select]
# v0.9: orchestrator.eval.num_examples = 16 (first 16 tasks of the infinite stream).
limit = 16

[orchestrator.eval.sampling]
max_tokens = 4096
temperature = 1.0
top_p = 1.0

[[orchestrator.eval.source]]
name = "eval-snake-easy-fixed"
env.taskset.id = "glyphbench"
env.taskset.tasks = ["glyphbench/classics-snake-easy-v0"]
env.taskset.seed = 1000000
env.taskset.num_seeds = 16
env.taskset.mixed_seeds = false
env.taskset.max_output_tokens = 4096
env.taskset.forfeit_mode = "noop"
env.taskset.use_memory = false
env.player.harness.id = "glyphbench"
env.player.runtime.type = "subprocess"

[inference]

[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/glyphbench-vllm-cache"
FLASHINFER_WORKSPACE_BASE = "/tmp/glyphbench-flashinfer-cache"

[inference.vllm]
max_model_len = 65536
# Scoped mitigation for the pinned vLLM activation kernel (GlyphBench docs/DEPENDENCIES.md).
max_num_batched_tokens = 8192
enable_chunked_prefill = true
tensor_parallel_size = 1
data_parallel_size = 8
data_parallel_size_local = 8
api_server_count = 8
gpu_memory_utilization = 0.92
enable_prefix_caching = true
enforce_eager = false
gdn_prefill_backend = "triton"

[inference.vllm.compilation_config]
custom_ops = ["-silu_and_mul"]
